<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: Canvas; color: CanvasText;
  }
  #status { font-size: 12px; opacity: 0.7; margin-bottom: 8px; }
  #page {
    background: rgba(127,127,127,0.06); border: 1px solid rgba(127,127,127,0.2);
    border-radius: 8px; padding: 20px; min-height: 200px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; line-height: 1.6;
  }
  #bar { height: 4px; border-radius: 2px; background: rgba(127,127,127,0.2); margin-bottom: 10px; overflow: hidden; }
  #bar-fill { height: 100%; background: #5B8DEF; width: 0%; transition: width 0.2s; }
</style>
</head>
<body>
  <div id="bar"><div id="bar-fill"></div></div>
  <div id="status"></div>
  <div id="page"></div>

  <script>
    // Auto-paginates without user interaction: as soon as a chunk arrives,
    // if it carries a next_ref, immediately ask the parent for the next
    // one. The parent stays blind — it just relays `source` verbatim.
    let assembled = "";
    let totalChunks = 0;

    function render(data) {
      totalChunks = data.total_chunks || 0;
      appendRows(data);
    }

    function appendRows(data) {
      assembled += data.data || "";
      draw(data.chunk, data.next_ref);
      if (data.next_ref) {
        window.parent.postMessage({ type: "request_data", source: data.next_ref }, "*");
      }
    }

    function draw(chunk, nextRef) {
      const pct = totalChunks ? Math.min(100, Math.round((chunk / totalChunks) * 100)) : 0;
      document.getElementById("bar-fill").style.width = pct + "%";
      document.getElementById("status").textContent = nextRef
        ? `Assembling report… chunk ${chunk} of ${totalChunks}`
        : `Report ready — ${totalChunks} chunks assembled`;
      document.getElementById("page").textContent = assembled;
    }

    window.addEventListener("message", (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "hydrate") render(e.data.data);
      if (e.data.type === "append") appendRows(e.data.data);
    });
  </script>
</body>
</html>
