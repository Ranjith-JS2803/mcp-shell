<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: Canvas; color: CanvasText;
  }
  #title { font-size: 13px; font-weight: 600; margin: 0 0 8px 2px; opacity: 0.85; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .line { fill: none; stroke: #5B8DEF; stroke-width: 2.5; }
  .area { fill: #5B8DEF; opacity: 0.08; }
  .point { fill: #5B8DEF; }
  .label { font-size: 11px; fill: currentColor; opacity: 0.75; }
  .value { font-size: 11px; fill: currentColor; font-weight: 600; }
  .axis-line { stroke: currentColor; stroke-opacity: 0.15; }
  #empty { font-size: 13px; opacity: 0.6; padding: 24px; text-align: center; }
</style>
</head>
<body>
  <div id="title"></div>
  <div id="chart"></div>

  <script>
    let state = { labels: [], values: [], title: "" };

    function render(data) {
      state = { ...state, ...data };
      draw();
    }

    function appendRows(data) {
      state.labels = state.labels.concat(data.labels || []);
      state.values = state.values.concat(data.values || []);
      draw();
    }

    function draw() {
      document.getElementById("title").textContent = state.title || "";
      const chartEl = document.getElementById("chart");
      const { labels, values } = state;

      if (!labels.length) {
        chartEl.innerHTML = '<div id="empty">No data</div>';
        return;
      }

      const width = chartEl.clientWidth || 600;
      const height = 320;
      const padding = { top: 24, right: 16, bottom: 36, left: 16 };
      const plotW = width - padding.left - padding.right;
      const plotH = height - padding.top - padding.bottom;
      const maxVal = Math.max(...values, 1);
      const minVal = Math.min(...values, 0);
      const range = maxVal - minVal || 1;
      const step = labels.length > 1 ? plotW / (labels.length - 1) : 0;

      const points = values.map((v, i) => {
        const x = padding.left + i * step;
        const y = padding.top + plotH - ((v - minVal) / range) * plotH;
        return [x, y];
      });

      const linePath = points.map((p, i) => (i === 0 ? "M" : "L") + p[0] + "," + p[1]).join(" ");
      const baseline = padding.top + plotH;
      const areaPath = `${linePath} L${points[points.length - 1][0]},${baseline} L${points[0][0]},${baseline} Z`;

      const dots = points
        .map(([x, y]) => `<circle class="point" cx="${x}" cy="${y}" r="3"></circle>`)
        .join("");

      const valueLabels = points
        .map(([x, y], i) => `<text class="value" x="${x}" y="${y - 10}" text-anchor="middle">${formatValue(values[i])}</text>`)
        .join("");

      const axisLabels = labels
        .map((l, i) => `<text class="label" x="${points[i][0]}" y="${height - padding.bottom + 16}" text-anchor="middle">${truncate(l)}</text>`)
        .join("");

      chartEl.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
          <line class="axis-line" x1="${padding.left}" y1="${baseline}" x2="${width - padding.right}" y2="${baseline}"></line>
          <path class="area" d="${areaPath}"></path>
          <path class="line" d="${linePath}"></path>
          ${dots}
          ${valueLabels}
          ${axisLabels}
        </svg>`;
    }

    function truncate(s) {
      s = String(s);
      return s.length > 10 ? s.slice(0, 9) + "…" : s;
    }

    function formatValue(v) {
      if (Math.abs(v) >= 1_000_000) return (v / 1_000_000).toFixed(1) + "M";
      if (Math.abs(v) >= 1_000) return (v / 1_000).toFixed(1) + "k";
      return String(v);
    }

    window.addEventListener("message", (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "hydrate") render(e.data.data);
      if (e.data.type === "append") appendRows(e.data.data);
    });

    window.addEventListener("resize", draw);
  </script>
</body>
</html>
