<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    background: Canvas; color: CanvasText;
    display: flex; flex-direction: column; height: 100%;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; white-space: nowrap; }
  thead th {
    cursor: pointer; user-select: none; font-weight: 600;
    border-bottom: 1px solid currentColor; opacity: 0.85;
    position: sticky; top: 0; background: Canvas;
  }
  thead th:hover { opacity: 1; }
  .sort-arrow { opacity: 0.5; margin-left: 4px; font-size: 10px; }
  tbody tr:nth-child(odd) { background: rgba(127,127,127,0.06); }
  tbody td { border-bottom: 1px solid rgba(127,127,127,0.08); }
  #footer { flex: 0 0 auto; margin-top: 8px; font-size: 12px; opacity: 0.75; text-align: center; }
  #empty { font-size: 13px; opacity: 0.6; padding: 24px; text-align: center; }
  #wrap { flex: 1 1 auto; overflow: auto; min-height: 0; }
</style>
</head>
<body>
  <div id="wrap"></div>
  <div id="footer"></div>

  <script>
    // This template is deliberately the only thing that understands
    // pagination — it just relays whatever `next_ref` the mcp-server hands
    // it back to the parent, and stops when `next_ref` is absent. The
    // parent (chat-interface) never inspects or builds that URI itself.
    //
    // Loading more is triggered by scroll position, not a button: when the
    // scrollable body nears its bottom, and nothing is already in flight,
    // it asks for the next page automatically.
    const SCROLL_THRESHOLD_PX = 80;

    let state = { columns: [], rows: [], total_count: 0, next_ref: null };
    let sort = { index: null, dir: 1 };
    let loading = false;

    function render(data) {
      state = { ...state, ...data };
      loading = false;
      draw();
    }

    function appendRows(data) {
      state.rows = state.rows.concat(data.rows || []);
      state.next_ref = data.next_ref ?? null;
      state.total_count = data.total_count ?? state.total_count;
      loading = false;
      draw();
    }

    function sortedRows() {
      if (sort.index === null) return state.rows;
      const i = sort.index;
      return [...state.rows].sort((a, b) => {
        const av = a[i], bv = b[i];
        if (av === bv) return 0;
        return (av > bv ? 1 : -1) * sort.dir;
      });
    }

    function onHeaderClick(i) {
      sort = sort.index === i ? { index: i, dir: -sort.dir } : { index: i, dir: 1 };
      draw();
    }

    function draw() {
      const wrap = document.getElementById("wrap");
      const footer = document.getElementById("footer");

      if (!state.columns.length) {
        wrap.innerHTML = '<div id="empty">No data</div>';
        footer.innerHTML = "";
        return;
      }

      const rows = sortedRows();

      const head = state.columns
        .map((c, i) => {
          const arrow = sort.index === i ? (sort.dir === 1 ? "▲" : "▼") : "";
          return `<th onclick="onHeaderClick(${i})">${escapeHtml(c)}<span class="sort-arrow">${arrow}</span></th>`;
        })
        .join("");

      const body = rows
        .map((row) => `<tr>${row.map((v) => `<td>${escapeHtml(v)}</td>`).join("")}</tr>`)
        .join("");

      wrap.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;

      let status = `${state.rows.length} of ${state.total_count} rows`;
      if (loading) status += " · loading more…";
      else if (!state.next_ref) status += " · all loaded";
      footer.textContent = status;

      maybeLoadMore(); // in case the first page doesn't even fill the viewport
    }

    function maybeLoadMore() {
      const wrap = document.getElementById("wrap");
      if (loading || !state.next_ref) return;
      const nearBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - SCROLL_THRESHOLD_PX;
      if (nearBottom) loadMore();
    }

    function loadMore() {
      if (loading || !state.next_ref) return;
      loading = true;
      draw();
      window.parent.postMessage({ type: "request_data", source: state.next_ref }, "*");
    }

    function escapeHtml(v) {
      return String(v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    document.getElementById("wrap").addEventListener("scroll", maybeLoadMore);

    window.addEventListener("message", (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "hydrate") render(e.data.data);
      if (e.data.type === "append") appendRows(e.data.data);
    });
  </script>
</body>
</html>
