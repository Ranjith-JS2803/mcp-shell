services:
  mcp-shell-redis:
    container_name: mcp-shell-redis
    image: redis/redis-stack:7.4.0-v8
    ports:
      - "6379:6379"
      - "8001:8001"   # RedisInsight
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  seed:
    container_name: mcp-shell-seed
    build:
      context: .
      dockerfile: services/ecommerce-mcp-server/Dockerfile
    command: ["uv", "run", "python", "seed/seed_data.py"]
    environment:
      DB_PATH: /app/data/mcp_server.db
    volumes:
      - mcp-data:/app/data
    restart: "no"

  ecommerce-mcp-server:
    container_name: ecommerce-mcp-server
    build:
      context: .
      dockerfile: services/ecommerce-mcp-server/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - mcp-data:/app/data
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8002), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8003:8003"
    environment:
      MCP_SERVER_URL: http://ecommerce-mcp-server:8002/mcp
      REDIS_URL: redis://mcp-shell-redis:6379/0
      LLM_AGENT_URL: http://llm-agent:8004
    depends_on:
      ecommerce-mcp-server:
        condition: service_healthy
      mcp-shell-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  llm-agent:
    container_name: llm-agent
    build:
      context: .
      dockerfile: services/llm-agent/Dockerfile
    ports:
      - "8004:8004"
    environment:
      GATEWAY_URL: http://gateway:8003
    env_file:
      - .env
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  chat-interface:
    container_name: chat-interface
    build:
      context: ./chat-interface
    ports:
      - "3000:3000"
    environment:
      # Consumed by the browser, not by this container — must be a
      # host-reachable URL, not gateway's internal compose hostname.
      VITE_GATEWAY_URL: http://localhost:8003
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mcp-data:
  redis-data:
